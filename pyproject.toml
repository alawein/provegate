[project]
name = "provegate"
version = "0.1.1"
description = "Three MCP servers for shared belief formation in AI-assisted development"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0.0"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0", "mypy>=1.10"]

[project.scripts]
scan-drift = "scripts.scan_repo:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared"]

[tool.ruff.lint]
# Ignore compact style choices (deliberate in this codebase)
ignore = ["E401", "E701", "E702", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
exclude = ["tests/", "scripts/", "website/"]
