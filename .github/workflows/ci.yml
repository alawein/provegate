name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        # The three server dirs are hyphenated (not valid package names), so each
        # server.py maps to the same top-level module "server" in one invocation
        # ("Duplicate module named server"). Check them separately so every file is
        # fully type-checked without excluding any of them.
        run: |
          mypy claude-drift/server.py
          mypy claude-memory-mesh/server.py
          mypy claude-proof/server.py
          mypy shared/

      - name: Test
        run: pytest --tb=short -q
